# Read technology/gitlab-runners/_index in the wiki before editing this file.
#
# llama [fedora, podman] is a SHELL executor: `image:` is ignored and node is
# NOT on the host, so every node step runs in a pinned container we start
# ourselves. miniserver [miniserver, windows] runs node on the host with no
# usable Python and no proven compiler (wiki: miniserver-runner); the Windows
# package job still names each missing tool before it fails.
#
# Phase 00 established that NO native compilation is required: the encrypted
# SQLite module ships N-API prebuilds and electron-builder runs with
# npmRebuild=false. Windows is built on Windows by choice, not by necessity.
#
# The check job runs `npm test`, which is what guards pillar P1. Electron-level
# checks run in the smoke jobs below, under xvfb on Linux.
# That split is deliberate and is recorded in the spec's verifier section.
#
# `npm ci --ignore-scripts` is load-bearing, not hygiene. The SQLite package
# declares `install: node-gyp rebuild`. Newer npm gates install scripts and
# warns instead of running them, which is why the local machine and the
# node:24 container silently took the prebuild path -- while miniserver's npm
# (bundled with node 26) ran the rebuild and failed for want of a Python
# node-gyp would accept. The flag makes all three environments behave the same
# and keeps the no-compile property from depending on an npm default.

stages: [check, package, publish]

variables:
  NODE_IMAGE: docker.io/library/node:24-bookworm
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

.node_container: &node_container
  tags: [fedora, podman]
  before_script:
    - podman pull "$NODE_IMAGE"

check:
  <<: *node_container
  stage: check
  script:
    - |
      podman run --rm -v "$CI_PROJECT_DIR:/w:Z" -w /w "$NODE_IMAGE" bash -euo pipefail -c '
        # test/keychain.test.mjs round-trips through the real Secret Service
        # (D25) and never skips, so the container needs one: a D-Bus session
        # bus and a gnome-keyring unlocked with a throwaway password. Without
        # them the keychain tests fail, which is the intended behaviour.
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends dbus gnome-keyring
        npm ci --ignore-scripts
        npm run build
        # The P1 pillar gate. These assert that every frame the client sends
        # reaches the server through our own transport, and that a tolerated
        # probe costs one process spawn -- the properties an SDK upgrade can
        # silently take away. Without this job the pillar is unguarded.
        dbus-run-session -- bash -euo pipefail -c "
          printf ci-throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          npm test
        "
        # D11 gate: macOS stays buildable even though it is never built.
        node scripts/check-macos-prebuilds.mjs
      '

# The suite on Windows. Its reason to exist is the keychain round trip against
# Credential Manager (phase 02 acceptance); it also runs everything else, which
# had never run on miniserver before phase 02. The runner is a service, so this
# job is also the evidence for whether its account has a credential store.
check:windows:
  stage: check
  tags: [miniserver, windows]
  script:
    - node --version
    - npm ci --ignore-scripts
    - npm run build
    - npm test

# Phase 04 acceptance through the real app (test/smoke, playwright-core
# driving Electron). Separate from `check` because it needs a display and the
# Electron binary, which `npm ci --ignore-scripts` does not download: the
# electron package fetches it in a postinstall script, run here by hand.
# Electron refuses to run as root without --no-sandbox; the tests pass it when
# they see uid 0, which is how this container runs.
smoke:linux:
  <<: *node_container
  stage: check
  script:
    - |
      podman run --rm -v "$CI_PROJECT_DIR:/w:Z" -w /w -e ELECTRON_CACHE "$NODE_IMAGE" bash -euo pipefail -c '
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
          xvfb xauth dbus libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 \
          libgbm1 libasound2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxss1 libx11-xcb1
        npm ci --ignore-scripts
        node node_modules/electron/install.js
        # Diagnostics (2026-09-25): this job once hung in build:renderer while
        # `check`, running the same build, passed. Each step is marked and
        # bounded so a hang names its step and fails in 10 minutes.
        echo "== nproc $(nproc); $(free -m | awk "/Mem:/ {print \$2\" MB RAM\"}")"
        step() { echo "== $1 ($(date +%T))"; shift; timeout 600 "$@"; }
        step protocol npm run build:protocol
        step storage npm run build:storage
        step platform npm run build:platform
        step backend npm run build:backend
        step app npm run build:app
        step "renderer tsc" npx tsc -p app/renderer/tsconfig.json
        step "renderer vite" npx vite build -c app/renderer/vite.config.mts --logLevel info
        echo "== build done ($(date +%T))"
        # Xvfb is started directly, not through xvfb-run: pipeline 566 hung
        # for an hour inside xvfb-run before npm printed a line, on llama
        # only (the same image passes elsewhere). This names a display that
        # fails to start, and bounds the run; pw:browser logs Electron itself.
        Xvfb :99 -screen 0 1400x900x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
        for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
        if [ ! -S /tmp/.X11-unix/X99 ]; then echo "== Xvfb did not start"; cat /tmp/xvfb.log; exit 1; fi
        echo "== Xvfb up ($(date +%T))"
        DISPLAY=:99 DEBUG=pw:browser timeout 900 npm run test:smoke
      '

# The same on Windows. The runner is a LocalSystem service, and Electron opens
# its windows in that session: this job passed on its first run (2026-09-25),
# so the Windows smoke tests stay automated.
smoke:windows:
  stage: check
  tags: [miniserver, windows]
  script:
    - npm ci --ignore-scripts
    - node node_modules/electron/install.js
    - npm run build
    - npm run test:smoke

package:linux:
  <<: *node_container
  stage: package
  script:
    - |
      podman run --rm -v "$CI_PROJECT_DIR:/w:Z" -w /w \
        -e ELECTRON_CACHE -e ELECTRON_BUILDER_CACHE "$NODE_IMAGE" bash -euo pipefail -c '
          npm ci --ignore-scripts
          npm run build
          npx electron-builder --linux AppImage deb --publish never
        '
    - test -n "$(ls release/*.AppImage 2>/dev/null)"
    - test -n "$(ls release/*.deb 2>/dev/null)"
  artifacts:
    paths: [release/*.AppImage, release/*.deb]
    expire_in: 1 week

package:windows:
  stage: package
  tags: [miniserver, windows]
  script:
    # The runner is new. Fail with the missing tool named, not with a stack trace.
    - node --version
    - npm --version
    - npm ci --ignore-scripts
    - npm run build
    # A zip of the app folder, no installer (decided 2026-11-03; the nsis
    # settings stay in package.json for when an installer comes back).
    - npx electron-builder --win zip --publish never
    - if (-not (Test-Path release/*.zip)) { throw "no zip produced" }
  artifacts:
    paths: [release/*.zip]
    expire_in: 1 week

# A copy on GitHub of main and the tags, with the agent material taken out of
# every commit: CLAUDE.md, .claude/ and docs/reconcile/ (doc-reconcile's working
# files, which point into the private wiki). Runs for a version tag only (v0.1.0,
# matching package.json's version), once every job above passed; a push to main
# goes nowhere until the next release. Commit messages are not rewritten.
#
# GH_TOKEN is a masked, protected CI/CD variable: a GitHub token with write
# access to the repository's contents. Protected, it reaches protected tags
# only, so v* must be a protected tag. filter-repo gives the same commits the same ids on every run, so
# each push adds to the last. The pushes are forced (+) because GitHub is only a
# copy: a change to what is filtered rewrites its commits, and anything made
# only on GitHub is overwritten. --prune deletes a tag GitHub holds that GitLab
# does not. Only main and tags go: the phase branches stay here.
#
# main is pushed as GitLab holds it when the tag's pipeline runs. git and
# python3 are on llama's host. The checkout is kept for package.json; the
# filtering works on a fresh mirror of its own in a folder that goes with the job.
mirror:github:
  stage: publish
  tags: [fedora, podman]
  resource_group: github-mirror
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    FILTER_REPO_VERSION: "2.47.0"
    GITHUB_REPO: github.com/mtgeekman/MCP-Explorer.git
  script:
    - |
      set -euo pipefail
      : "${GH_TOKEN:?GH_TOKEN is not set for this pipeline}"
      version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
      if [ "$CI_COMMIT_TAG" != "v$version" ]; then
        echo "the tag $CI_COMMIT_TAG is not v$version, the version in package.json"; exit 1
      fi
      scratch="$(mktemp -d)"
      trap 'rm -rf "$scratch"' EXIT
      python3 -m venv "$scratch/venv"
      "$scratch/venv/bin/pip" install --quiet "git-filter-repo==$FILTER_REPO_VERSION"
      git clone --mirror "$CI_REPOSITORY_URL" "$scratch/work"
      cd "$scratch/work"
      "$scratch/venv/bin/git-filter-repo" --invert-paths \
        --path CLAUDE.md --path-glob '*/CLAUDE.md' --path .claude/ --path docs/reconcile/
      # Nothing filtered may survive in any commit that is about to leave.
      leaked="$(git log --all --format= --name-only | grep -E '(^|/)CLAUDE\.md$|^\.claude/|^docs/reconcile/' || true)"
      if [ -n "$leaked" ]; then
        echo "filtered paths are still in the history:"; echo "$leaked" | sort -u; exit 1
      fi
      git push --prune "https://x-access-token:${GH_TOKEN}@${GITHUB_REPO}" \
        '+refs/heads/main:refs/heads/main' '+refs/tags/*:refs/tags/*'

# The GitHub release for a version tag: the tag's message as its notes, and the
# packages both package jobs kept (the Windows zip, the AppImage and the .deb). After mirror:github, since the tag must be
# on GitHub first. The message must be release-notes/<tag>.txt as committed,
# so the notes are the ones reviewed in a diff: tag with
#   git tag -a vX.Y.Z -F release-notes/vX.Y.Z.txt --cleanup=verbatim
# ci/github-release.mjs (tested by test/github-release.test.mjs) starts a
# draft and takes it down if an upload fails, so the job can run again.
release:github:
  <<: *node_container
  stage: publish
  resource_group: github-mirror
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: package:windows
      artifacts: true
    - job: package:linux
      artifacts: true
    - job: mirror:github
      artifacts: false
  variables:
    GITHUB_REPO: mtgeekman/MCP-Explorer
  script:
    - |
      podman run --rm -v "$CI_PROJECT_DIR:/w:Z" -w /w \
        -e GH_TOKEN -e GITHUB_REPO -e CI_COMMIT_TAG -e CI_COMMIT_TAG_MESSAGE "$NODE_IMAGE" bash -euo pipefail -c '
          node ci/github-release.mjs release/*.zip release/*.AppImage release/*.deb
        '
