<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MCP Explorer</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a66"/>
      <stop offset="1" stop-color="#0a1a40"/>
    </linearGradient>
  </defs>

  <!-- The tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>

  <!-- The lens: the glass, then the wire seen through it -->
  <circle cx="222" cy="222" r="124" fill="url(#glass)"/>

  <!-- A message going out (the wire log's out arrow) -->
  <path d="M158 190 H274" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <path d="M246 160 L280 190 L246 220" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Its answer coming back (the wire log's in arrow) -->
  <path d="M286 256 H170" fill="none" stroke="#86efac" stroke-width="24" stroke-linecap="round"/>
  <path d="M198 226 L164 256 L198 286" fill="none" stroke="#86efac" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The rim and the handle -->
  <circle cx="222" cy="222" r="124" fill="none" stroke="#ffffff" stroke-width="34"/>
  <path d="M316 316 L404 404" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
</svg>
